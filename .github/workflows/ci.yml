name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run tests
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Shellcheck
        run: |
          shopt -s nullglob
          scripts=(assets/scripts/*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then
            shellcheck --shell=sh "${scripts[@]}"
          else
            echo "No shell scripts to check"
          fi
